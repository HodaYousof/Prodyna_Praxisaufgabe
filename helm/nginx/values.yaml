# Shared defaults — Stages überschreiben nur Unterschiede.
namespace: staging

replicaCount: 1

image:
  repository: nginx
  tag: "1.27.3" # versioniert statt floating :latest / :stable
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

resources: {}
# Staging oft ohne Limits; Production setzt Requests/Limits in values-production.yaml
