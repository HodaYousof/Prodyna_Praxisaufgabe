namespace: production

replicaCount: 2 # Startwert; bei autoscaling steuert HPA die Replicas

image:
  tag: "1.27.3" # immutable Tag (kein :latest / :stable)

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
