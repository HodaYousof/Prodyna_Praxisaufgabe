name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging oder production (fuer Helm)
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write # OIDC -> Azure

jobs:
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_resource_group_name: RG-Hoda-Yousof
          TF_VAR_subnet_aks_address: '["10.0.1.0/24"]'
          TF_VAR_subnet_endpoints_address: '["10.0.2.0/24"]'

  helm:
    name: Helm deploy
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "RG-Hoda-Yousof" \
            --name "aks-prodyna-dev" \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Ensure namespace
        run: kubectl create namespace ${{ inputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade --install
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            helm upgrade --install nginx-staging ./helm/nginx \
              -f ./helm/nginx/values-staging.yaml \
              --namespace staging
          else
            helm upgrade --install nginx-prod ./helm/nginx \
              -f ./helm/nginx/values-production.yaml \
              --namespace production
          fi
